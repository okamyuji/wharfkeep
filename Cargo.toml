[package]
name = "wharfkeep"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "colimaとDockerをメニューバーとウィンドウから扱うmacOSアプリ"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "system_fonts", "wgpu", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "macros"] }
tray-icon = "0.26"
winit = "0.30"

[dev-dependencies]
tempfile = "3"
