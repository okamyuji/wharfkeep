[package]
name = "wharfkeep"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "colimaとDockerをメニューバーとウィンドウから扱うmacOSアプリ"

[dependencies]
bollard = "0.21.1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "system_fonts", "wgpu", "wayland", "x11"] }
futures-util = "0.3.34"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
winit = "0.30"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSCell"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["net"] }
