name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # objc2 と AppKit は macOS でしかコンパイルできない。中央の rust-ci は Linux 固定なので使わない。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check licenses

  release:
    # main に入った版の release がまだ無いときだけ、組んだ .app を添えて公開する。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, security, licenses]
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # 依存の build script が token を読めないよう、組み立てには token を渡さない。
      - name: Build
        if: steps.version.outputs.exists == 'false'
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          WHARFKEEP_NO_BUMP=1 scripts/bundle.sh
          arch=$(lipo -archs target/wharfkeep.app/Contents/MacOS/wharfkeep)
          zip="target/wharfkeep-$VERSION-macos-$arch.zip"
          ditto -c -k --keepParent target/wharfkeep.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          notes="$(cat .github/release-notes.md)

          SHA-256 of the zip: \`$(shasum -a 256 "$ZIP" | cut -d' ' -f1)\`"
          gh release create "v$VERSION" "$ZIP" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "wharfkeep $VERSION" \
            --notes "$notes" --generate-notes
