name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # objc2 と AppKit は macOS でしかコンパイルできない。中央の rust-ci は Linux 固定なので使わない。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check licenses

  release-build:
    # main に入った版の release がまだ無いときだけ組む。書き込みの token は持たせない。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, security, licenses]
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 404 だけを「無い」とする。ほかの失敗（5xx、rate limit）を「無い」と読むと、古いタグに公開しかねない。
          found() {
            if err=$(gh api "$1" 2>&1 >/dev/null); then return 0; fi
            # gh は「gh: <本文の message> (HTTP 404)」、本文が JSON でなければ「gh: HTTP 404」の1行を出す。
            if [[ $err =~ ^gh:\ (.*\ \(HTTP\ 404\)|HTTP\ 404)$ ]]; then return 1; fi
            echo "::error::GitHub API failed for $1: $err"
            exit 1
          }
          if found "repos/$GITHUB_REPOSITORY/releases/tags/v$version"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # タグだけが先にあると、gh release create は --target を無視してそのタグに付ける。
          if found "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version"; then
            echo "::error::tag v$version exists without a release; delete the tag or raise the version"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          WHARFKEEP_RELEASE=1 scripts/bundle.sh
          shown=$(plutil -extract CFBundleShortVersionString raw target/wharfkeep.app/Contents/Info.plist)
          [ "$shown" = "$VERSION" ] || { echo "::error::bundle is $shown, expected $VERSION"; exit 1; }
          arch=$(lipo -archs target/wharfkeep.app/Contents/MacOS/wharfkeep)
          mkdir -p dist
          ditto -c -k --keepParent target/wharfkeep.app "dist/wharfkeep-$VERSION-macos-$arch.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.publish == 'true'
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release-publish:
    # 書き込みの token はこのジョブだけが持つ。依存のコードはここでは動かない。
    if: needs.release-build.outputs.publish == 'true'
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-build.outputs.version }}
        run: |
          # 404 だけを「無い」とする。ほかの失敗（5xx、rate limit）を「無い」と読むと、古いタグに公開しかねない。
          found() {
            if err=$(gh api "$1" 2>&1 >/dev/null); then return 0; fi
            # gh は「gh: <本文の message> (HTTP 404)」、本文が JSON でなければ「gh: HTTP 404」の1行を出す。
            if [[ $err =~ ^gh:\ (.*\ \(HTTP\ 404\)|HTTP\ 404)$ ]]; then return 1; fi
            echo "::error::GitHub API failed for $1: $err"
            exit 1
          }
          # 先に走った実行が同じ版を公開し終えていれば、何もしない。
          if found "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION"; then
            echo "v$VERSION is already released"
            exit 0
          fi
          set -- dist/wharfkeep-"$VERSION"-macos-*.zip
          # set -e は && の途中の失敗では止まらないので、1つずつ止める。
          [ "$#" -eq 1 ] || { echo "::error::expected one zip, found $#"; exit 1; }
          [ -f "$1" ] || { echo "::error::no zip for v$VERSION"; exit 1; }
          notes="$(cat .github/release-notes.md)

          SHA-256 of the zip: \`$(sha256sum "$1" | cut -d' ' -f1)\`"
          gh release create "v$VERSION" "$1" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "wharfkeep $VERSION" \
            --notes "$notes" --generate-notes
