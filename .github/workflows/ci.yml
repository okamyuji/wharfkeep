name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/rust-ci.yml@v1
    with:
      # 中央のCIはLinuxで動く。tray-iconとmudaはLinuxでGTK、libxdo、AppIndicatorを使い、
      # eframe（winit、wgpu）はxkbcommon、wayland、X11に結び付く。
      apt-packages: libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev pkg-config

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check licenses
